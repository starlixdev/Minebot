name: MineBOT
version: 2.1.1-java
main: com.minebot.MineBotPlugin
api-version: '1.20'
author: MineBOT
load: POSTWORLD
commands:
  minebot:
    description: Manage MineBOT Java bots.
    usage: /minebot <list|create|start|stop|reload|validate|status>
    permission: minebot.admin
permissions:
  minebot.admin:
    description: Full access to MineBOT administration commands.
    default: op
